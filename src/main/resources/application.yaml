
spring:
  application:
    name: bank

  datasource:
    url: jdbc:mysql://localhost:3306/bank_db
    username: ${DATA_UserName}
    password: ${DATA_Password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: never
